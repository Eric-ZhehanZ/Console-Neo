<!DOCTYPE html>
<html><head>
    <meta charset="utf-8">
    <title>Console Neo - Cast</title>
    <link rel="stylesheet" href="/ui/projector.css">
    
  <meta name="robots" content="noindex"><style>html,body{overflow:hidden!important;scrollbar-width:none}::-webkit-scrollbar{display:none}*{cursor:default!important}</style></head>
  <body>
    <div class="stage">
    <div class="layer full background">
      <div class="brand">
        Console Neo
      </div>
    </div>

    <div class="bottom-bar not-tricky opacity-transition" style="">
      <div class="bottom-title small">
        <span>UN Security Council</span>
      </div>
      <div class="counter-group">
        <i class="material-icons">person</i>
        <div class="counter">
          <div class="present">14</div>
          <div class="separator">/</div>
          <div class="all">15</div>
        </div>
        <div class="counter-indicator">
          <div class="counter-indicator-hint">Simple Majority</div>
          <div class="counter-indicator-value">8</div>
        </div>
        <div class="counter-indicator">
          <div class="counter-indicator-hint">Two-Thirds</div>
          <div class="counter-indicator-value">10</div>
        </div>
        <div class="counter-indicator">
          <div class="counter-indicator-hint">One-Fifth</div>
          <div class="counter-indicator-value">3</div>
        </div>
      </div>
    </div>

    <div class="layer timer-layer" style="display: none;">
      <i class="material-icons cast-watermark">timer</i>
      <div class="timer-name"></div>
      <div class="timer timer-left">
  <span class="timer-hour" style="display: none;">
    0
  </span>
  <span class="timer-separator" style="display: none;">:</span>
  <span class="timer-minute">
    0
  </span>
  <span class="timer-separator">:</span>
  <span class="timer-second">
    00
  </span>
</div>
      
      <div class="timer-progress">
        <div class="timer-progress-inner" style="transform: translateX(0px);">
        </div>
      </div>
    </div>

    <div class="layer file-layer full file-full" style="display: none;">
      <i class="material-icons cast-watermark">insert_drive_file</i>
      <div class="file-pdf" style="display: none;"></div>
      
      <div class="file-overlay"></div>
    </div>

    

    <div class="layer list-layer full headered">
      <i class="material-icons cast-watermark">record_voice_over</i>
      <div class="cast-header cast-header-stacked">
        <div class="cast-title">
          <span class="cast-title-text">Securing critical sea lanes</span>
        </div>
        <div class="cast-header-row">
          <div class="speaker-indicator">
            <span class="speaker-current-wrap">
              <span class="speaker-current speaker-swap-transition">United Kingdom</span>
            </span>
            <span class="speaker-next-wrap">
              <span class="speaker-next speaker-swap-transition">Ecuador</span>
            </span>
          </div>
          <div class="cast-header-spacer"></div>
          <div class="timer-current">
            <i class="material-icons">person</i>
            <div class="timer">
  <span class="timer-hour" style="display: none;">
    0
  </span>
  <span class="timer-separator" style="display: none;">:</span>
  <span class="timer-minute">
    0
  </span>
  <span class="timer-separator">:</span>
  <span class="timer-second">
    47
  </span>
</div>
          </div>
          <div class="timer-total">
            <i class="material-icons">access_time</i>
            <div class="timer">
  <span class="timer-hour" style="display: none;">
    0
  </span>
  <span class="timer-separator" style="display: none;">:</span>
  <span class="timer-minute">
    15
  </span>
  <span class="timer-separator">:</span>
  <span class="timer-second">
    00
  </span>
</div>
          </div>
        </div>
      </div>
      <div class="list speakers cast-body">
        <div class="list-item speaker item-transition">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="France">
            <span class="speaker-name-real">France</span>
          </div>
        </div><div class="list-item speaker item-transition">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="Japan">
            <span class="speaker-name-real">Japan</span>
          </div>
        </div><div class="list-item speaker item-transition bold waiting">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="United Kingdom">
            <span class="speaker-name-real">United Kingdom</span>
          </div>
        </div><div class="list-item speaker item-transition">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="Ecuador">
            <span class="speaker-name-real">Ecuador</span>
          </div>
        </div><div class="list-item speaker item-transition">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="China">
            <span class="speaker-name-real">China</span>
          </div>
        </div><div class="list-item speaker item-transition">

          <div class="list-item-indicator"></div>
          <div class="list-item-content speaker-name" data-text="Malta">
            <span class="speaker-name-real">Malta</span>
          </div>
        </div>
      </div>
    </div>

    

    

    </div>
    <div class="layer full mask" style="display: none;"></div>
  

</body></html>
